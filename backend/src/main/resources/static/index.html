<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Corporativo — AndesB2B</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="auth-single-wrapper">
        <header class="public-header">
            <div>
                <h1>ANDESB2B</h1>
                <p>Red de Abastecimiento y Comercio Mayorista para Pymes</p>
            </div>
            <div>
                <a href="/pantallas/registro.html" class="btn btn-success">Crear Cuenta Empresarial</a>
            </div>
        </header>

        <div id="public-alert" class="alert hidden"></div>

        <div class="card auth-card-centered">
            <h2>Iniciar Sesión</h2>
            <p class="text-muted">Ingresa con tu cuenta corporativa para gestionar compras, catálogo y despachos.</p>

            <form id="form-login" onsubmit="iniciarSesion(event)" novalidate>
                <label>Correo Corporativo</label>
                <input type="email" id="login-email" required placeholder="nombre@tuempresa.cl">

                <label>Contraseña</label>
                <input type="password" id="login-password" required placeholder="Ingresa tu contraseña">

                <button type="submit" class="btn btn-primary full-width">Ingresar al Portal</button>
            </form>

            <div class="auth-links">
                <a href="/pantallas/recuperar.html">¿Olvidaste tu contraseña? Restablécela aquí</a>
            </div>

            <div class="demo-box">
                <p><strong>Cuentas de demostración (Ingreso directo con 1 clic):</strong></p>
                <div class="demo-buttons">
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('pfuentes@ferreteriaaustral.cl')">Perfil Administrador</button>
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('cgomez@ferreteriaaustral.cl')">Perfil Vendedor</button>
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('msoto@constructorasur.cl')">Perfil Comprador</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/validaciones.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
