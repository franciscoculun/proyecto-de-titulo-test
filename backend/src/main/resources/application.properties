spring.application.name=andesb2b

server.port=${PORT:8080}

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/andesB2B_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Kepler@2026}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Servir el frontend directamente desde ../frontend/ en local y classpath:/static/ en contenedor
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# Endurecimiento de cookie de sesión (Punto 2)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Flag de demostración desactivado por defecto en producción (Punto 1)
app.demo=${APP_DEMO:false}