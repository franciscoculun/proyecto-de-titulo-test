<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — AndesB2B</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-single-wrapper">
        <header class="public-header">
            <div>
                <h1>ANDESB2B</h1>
                <p>Marketplace B2B para Pymes — Portal de Acceso Corporativo</p>
            </div>
            <div>
                <a href="pantallas/registro.html" class="btn btn-success">+ Registrar Empresa</a>
            </div>
        </header>

        <div id="public-alert" class="alert hidden"></div>

        <div class="card auth-card-centered">
            <h2>Ingreso de Usuarios Registrados</h2>
            <p class="text-muted">Ingresa tus credenciales corporativas para acceder al portal.</p>

            <form id="form-login" onsubmit="iniciarSesion(event)" novalidate>
                <label>Correo Electrónico Corporativo</label>
                <input type="email" id="login-email" required placeholder="nombre@empresa.cl">

                <label>Contraseña de Acceso</label>
                <input type="password" id="login-password" required placeholder="••••••••••••">

                <button type="submit" class="btn btn-primary full-width">Iniciar Sesión</button>
            </form>

            <div class="auth-links">
                <a href="pantallas/recuperar.html">¿Olvidaste tu contraseña? Recupérala aquí</a>
            </div>

            <div class="demo-box">
                <p><strong>Accesos rápidos de prueba (Clave: Andes2026!):</strong></p>
                <div class="demo-buttons">
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('pfuentes@ferreteriaaustral.cl')">Administrador</button>
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('cgomez@ferreteriaaustral.cl')">Vendedor</button>
                    <button type="button" class="btn btn-sm" onclick="AutocompletarLogin('msoto@constructorasur.cl')">Comprador</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/validaciones.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
