<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — AndesB2B</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="auth-single-wrapper">
        <header class="public-header">
            <div>
                <h1>ANDESB2B</h1>
                <p>Asistencia de Seguridad y Acceso</p>
            </div>
            <div>
                <a href="/index.html" class="btn btn-outline">Volver al Inicio</a>
            </div>
        </header>

        <div id="public-alert" class="alert hidden"></div>

        <div class="card auth-card-centered">
            <h2>Restablecer Contraseña</h2>
            <p class="text-muted">Ingresa tu correo corporativo y te enviaremos un código de seguridad para actualizar tu clave.</p>

            <form id="form-recuperar" onsubmit="solicitarToken(event)" novalidate>
                <label>Correo Corporativo Registrado</label>
                <input type="email" id="rec-email" required placeholder="nombre@tuempresa.cl">
                <button type="submit" class="btn btn-dark full-width">Solicitar Código de Seguridad</button>
            </form>

            <form id="form-restablecer" class="hidden" onsubmit="confirmarRestablecimiento(event)" style="margin-top:20px; border-top:1px solid #e2e8f0; padding-top:18px;" novalidate>
                <label>Código de Verificación</label>
                <input type="text" id="rec-token" required>

                <label>Nueva Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="rec-nueva-pass" required minlength="6" placeholder="Crea una contraseña segura">

                <button type="submit" class="btn btn-success full-width">Actualizar Contraseña</button>
            </form>
        </div>
    </div>

    <script src="/js/validaciones.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
