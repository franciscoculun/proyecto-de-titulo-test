<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empresa — AndesB2B</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <header class="public-header">
            <div>
                <h1>ANDESB2B</h1>
                <p>Incorporación de Empresas Proveedoras y Compradoras</p>
            </div>
            <div>
                <a href="/index.html" class="btn btn-outline">Volver al Inicio</a>
            </div>
        </header>

        <div id="public-alert" class="alert hidden"></div>

        <div class="card">
            <h2>Inscripción de Nueva Empresa</h2>
            <p class="text-muted">Completa la información comercial de tu empresa y los datos del administrador principal de la cuenta.</p>

            <form id="form-registro-empresa" onsubmit="registrarEmpresa(event)" novalidate>
                <div class="form-grid-2">
                    <div>
                        <h3 class="section-subtitle">1. Información Tributaria y Comercial</h3>
                        <label>RUT de la Empresa</label>
                        <input type="text" id="reg-rut-empresa" required placeholder="Ej: 76.543.210-3" oninput="formatearInputRut(this)">

                        <label>Razón Social</label>
                        <input type="text" id="reg-razon-social" required placeholder="Ej: Maestranza Austral SpA">

                        <label>Giro o Actividad Económica</label>
                        <input type="text" id="reg-giro" required placeholder="Ej: Fabricación de estructuras metálicas">

                        <label>Región</label>
                        <select id="reg-region" required>
                            <option value="Los Lagos">Región de Los Lagos</option>
                            <option value="Biobío">Región del Biobío</option>
                            <option value="Araucanía">Región de La Araucanía</option>
                            <option value="Metropolitana">Región Metropolitana</option>
                            <option value="Valparaíso">Región de Valparaíso</option>
                        </select>

                        <label>Dirección Comercial</label>
                        <input type="text" id="reg-direccion" required placeholder="Calle, número y comuna">
                    </div>

                    <div>
                        <h3 class="section-subtitle">2. Representante y Administrador de Cuenta</h3>
                        <label>Nombre y Apellidos</label>
                        <input type="text" id="reg-nombre-admin" required placeholder="Ej: Pedro Fuentes">

                        <label>RUT del Representante</label>
                        <input type="text" id="reg-rut-admin" required placeholder="Ej: 11.111.111-1" oninput="formatearInputRut(this)">

                        <label>Correo Corporativo</label>
                        <input type="email" id="reg-email-admin" required placeholder="contacto@tuempresa.cl">

                        <label>Contraseña de Acceso (mínimo 6 caracteres)</label>
                        <input type="password" id="reg-pass-admin" required minlength="6" placeholder="Crea tu contraseña de acceso">

                        <div style="margin-top: 24px;">
                            <button type="submit" class="btn btn-success full-width">Registrar Empresa y Activar Cuenta</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/validaciones.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
